[package]
name = "oxidoc-search"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Lexical and semantic search engine for static sites, with a native index builder and a wasm browser runtime"
readme = "README.md"
keywords = ["search", "bm25", "full-text-search", "wasm", "static-site"]
categories = ["text-processing", "wasm", "web-programming"]
documentation = "https://docs.rs/oxidoc-search"
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

[package.metadata.docs.rs]
features = ["wasm", "semantic", "builder"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wasm", "semantic"]
# Browser bindings: wasm-bindgen exports and the search island.
wasm = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:oxidoc-island"]
# Embedding-based search and hybrid RRF fusion.
semantic = ["dep:boostr", "dep:numr"]
# Native lexical index builder: records to BM25 index files.
builder = []
# Native vector index builder: embeds records with boostr on the CPU.
semantic-build = ["builder", "semantic"]

[[example]]
name = "search_cost"
required-features = ["semantic-build"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
oxidoc-text.workspace = true
rkyv.workspace = true

# Browser bindings
oxidoc-island = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

# ML-Rust ecosystem for semantic search
boostr = { workspace = true, optional = true }
numr = { workspace = true, optional = true }

[dev-dependencies]
splintr.workspace = true
wasm-bindgen-test.workspace = true
tempfile = "3"
flate2 = "1"
